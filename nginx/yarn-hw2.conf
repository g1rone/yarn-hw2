server {
    listen 19070;
    server_name _;

    location / {
        proxy_pass http://10.22.0.11:9870;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

